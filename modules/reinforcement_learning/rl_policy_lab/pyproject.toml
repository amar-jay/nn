[project]
name = "rl-policy-lab"
version = "0.1.0"
description = "Experiments with reinforcement learning policy updates and verifiable rewards"
readme = "README.md"
authors = [
    { name = "amar-jay", email = "abdelmanan.abdelrahman03@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.4.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "trl>=1.14.2",
]

[project.scripts]
rl-policy-lab = "rl_policy_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
